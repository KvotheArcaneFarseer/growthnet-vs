[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "growthnet"
version = "0.1.0"
description = "Local tooling for GrowthNet synthetic vestibular schwannoma embedding, validation, and longitudinal dataset experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.5",
    "monai>=1.3",
    "nibabel>=5.0",
    "numpy>=1.23",
    "pandas>=1.5",
    "Pillow>=9.0",
    "PyYAML>=6.0",
    "scikit-image>=0.20",
    "scipy>=1.9",
    "torch>=2.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
registration = [
    "antspyx>=0.5",
    "antspynet>=0.2",
    "tensorflow>=2.12",
]
presentations = [
    "lxml>=4.9",
    "python-pptx>=0.6.23",
]
training = [
    "accelerate>=0.27",
]

[tool.setuptools]
py-modules = ["embed_tumor"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "projects*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "projects/mri_registration/tests",
]
python_files = ["test_*.py"]
markers = [
    "fast: deterministic local tests that do not require clinical or remote data",
    "integration: local integration tests that may use optional imaging dependencies or more time",
    "slow: expensive tests that should be excluded from default local smoke runs",
]
addopts = "-ra"
